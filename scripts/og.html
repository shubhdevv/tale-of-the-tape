<!DOCTYPE html>
<!-- Social preview card template. Rendered to public/og.png (1200×630) with a headless browser. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Oswald, sans-serif; color: #f4f4f5; position: relative;
    background:
      radial-gradient(60% 55% at 50% -10%, rgba(225,29,46,.35), transparent 70%),
      radial-gradient(45% 50% at 100% 110%, rgba(240,207,103,.10), transparent 70%),
      #070708;
  }
  .split { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .side + .side { box-shadow: inset 1px 0 0 rgba(255,255,255,.08); }
  .q { font-size: 30px; font-weight: 300; letter-spacing: .04em; text-transform: uppercase; color: #a1a1aa; }
  .big { font-size: 170px; font-weight: 600; line-height: 1; }
  .btn { margin-top: 10px; font-size: 26px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; padding: 14px 40px; border: 2px solid rgba(255,255,255,.85); border-radius: 999px; }
  .vs { position: absolute; left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: #fff; color: #0b0b0d; display: grid; place-items: center; font-size: 38px; font-weight: 700; box-shadow: 0 0 0 12px rgba(7,7,8,.7); }
  .head { position: absolute; top: 44px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .foot { position: absolute; bottom: 42px; left: 0; right: 0; text-align: center; font-family: system-ui, sans-serif; font-size: 24px; color: #a1a1aa; letter-spacing: .02em; }
  .foot b { color: #f4f4f5; font-weight: 600; }
  .red { color: #e11d2e; }
</style>
</head>
<body>
  <div class="head">
    <svg width="36" height="36" viewBox="0 0 24 24"><path d="M8 1.5h8L22.5 8v8L16 22.5H8L1.5 16V8z" fill="none" stroke="#e11d2e" stroke-width="2.6"/></svg>
    Tale of the Tape
  </div>
  <div class="split">
    <div class="side"><div class="q">UFC wins</div><div class="big">22</div></div>
    <div class="side"><div class="q">Higher or lower?</div><div class="big red">?</div><div class="btn">Higher ▲</div></div>
  </div>
  <div class="vs">VS</div>
  <div class="foot"><b>UFC higher or lower</b> · 700+ fighters · 39 stats · one wrong call and you're out</div>
</body>
</html>
